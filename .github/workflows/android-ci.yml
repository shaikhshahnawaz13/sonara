name: SONARA CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonara-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners ship with the Android SDK (ANDROID_HOME is set), so no setup action is
      # needed. This step only guarantees the exact platform and build-tools this project compiles against.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --console=plain :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --console=plain :app:assembleDebug

      # Lint results are reported but do not gate M1; the gate is tests plus a successful build.
      - name: Lint
        continue-on-error: true
        run: ./gradlew --console=plain :app:lintDebug

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SONARA-unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SONARA-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn

      - name: Upload exported Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SONARA-room-schemas
          path: app/schemas/
          if-no-files-found: warn

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SONARA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
