name: SONARA Release (signed)

# Manual only. Needs four repository secrets (see docs/RELEASE.md). Nothing secret is stored in the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets exist
        env:
          K1: ${{ secrets.SONARA_KEYSTORE_BASE64 }}
          K2: ${{ secrets.SONARA_KEYSTORE_PASSWORD }}
          K3: ${{ secrets.SONARA_KEY_ALIAS }}
          K4: ${{ secrets.SONARA_KEY_PASSWORD }}
        run: |
          for v in K1 K2 K3 K4; do
            if [ -z "${!v}" ]; then echo "::error::A signing secret is missing. See docs/RELEASE.md."; exit 1; fi
          done

      - name: Restore keystore (runner temp only)
        env:
          KS: ${{ secrets.SONARA_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/sonara-release.jks"

      - run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --console=plain :app:testDebugUnitTest

      - name: Build signed release APK and AAB
        env:
          SONARA_KEYSTORE_FILE: ${{ runner.temp }}/sonara-release.jks
          SONARA_KEYSTORE_PASSWORD: ${{ secrets.SONARA_KEYSTORE_PASSWORD }}
          SONARA_KEY_ALIAS: ${{ secrets.SONARA_KEY_ALIAS }}
          SONARA_KEY_PASSWORD: ${{ secrets.SONARA_KEY_PASSWORD }}
        run: ./gradlew --console=plain :app:assembleRelease :app:bundleRelease

      - name: Verify the APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/sonara-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: SONARA-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: SONARA-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: SONARA-release-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: warn
